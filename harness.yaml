# Runtime knobs for the harness. Objective weights/shield rules belong to Epics 3;
# this epic adds symptom taxonomy + diagnosis + LLM/debate knobs.
event_rate_hz: 1.0
anomaly_gain: 1.0
ema:
  span: 20.0
adwin:
  delta: 0.002

# Closed symptom-token taxonomy (AD-3). Free-form symptom strings are never stored
# or matched; LLM prose maps onto these tokens at distill time. Owned by knowledge/.
symptom_taxonomy:
  - setpoint_divergence
  - feedback_offset
  - temp_spike
  - pressure_drop
  - flow_dip
  - no_current_change
  - noise_burst
  - deadband
  - valve_stuck
  - pump_surge

runbook:
  jaccard_threshold: 0.6
  min_tokens_match: 2
  store_path: knowledge/runbooks

diagnosis:
  causal_lags: [1, 2, 3]
  correlation_min: 0.6
  granger_enabled: true
  granger_maxlag: 2
  granger_pvalue: 0.05
  max_hypotheses: 3

llm:
  provider: openrouter
  default_model: deepseek/deepseek-v4-flash-0731
  budget_per_call_path: 3
  fallback: single_pass

debate:
  role_order: [proposer, critic, arbiter]
  max_turns: 1

# DECIDE objective weights (AD-6, reproducible winners) + candidate count.
decide:
  weights: {alpha: 0.5, beta: 0.15, gamma: 0.2, delta: 0.15}
  candidate_count: 2

# VERIFY outcome thresholds (AD-9), event-time sample windows (AD-10).
verify:
  window_samples: 20
  improved_threshold: 0.3
  worsened_threshold: 0.1

# Incident FSM (AD-2).
incident:
  retry_max: 3
  ttl_seconds_event: 3600
  db_path: incident/incidents.db

# Ablation arms / degraded modes (AD-6 / AD-13 / Epic 5.5-5.6). The shield is NEVER
# disabled by a variant flag.
variant:
  detector: adwin            # adwin | isolation_forest
  diagnosis_mode: full        # full | rule_only
  decide_mode: whatif         # whatif | static_priors
  red_team: false             # inject known-bad candidates (practice-only)
  llm_offline: false          # force mock-LLM replay / rule-only offline

# Rehearsal + demo (Epic 5).
demo:
  ui_dir: ui
  tts_clips_dir: ui/tts_clips
  e2e_jsonl: demo/e2e.jsonl
# ─── Track C runtime knobs (AD-9) — source knowledge stays in mapping.yaml: trackc:
# Staleness thresholds (AD-10), per-role LLM budgets (AD-4), wall-clock wait TTLs (AD-8).
trackc:
  stale_seconds: 30.0
  critical_seconds: 120.0
  approve_ttl_seconds: 300.0
  clarify_ttl_seconds: 600.0
  llm_budgets:
    supervisor: 3
    observer: 3
    maintenance: 3
    production: 3
    safety: 3
    action: 3
  mode: live
