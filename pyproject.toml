[project]
name = "seal-iot"
version = "0.2.0"
description = "SEAL IoT Smart Ops Harness - Epics 1-3 (foundation, perception, diagnosis, guarded action & verification)"
requires-python = ">=3.11.9,<3.13"
dependencies = [
    "paho-mqtt>=2.1.0",
    "river>=0.25.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "networkx>=3.6.1",
    "statsmodels>=0.14.6",
    "pandas>=2.0",
    "pytest>=8.0",
    "httpx>=0.28.1",
]

[tool.setuptools]
py-modules = ["config"]
packages = [
    "adapters",
    "act",
    "bus",
    "decide",
    "diagnose",
    "history",
    "incident",
    "knowledge",
    "learn",
    "llm",
    "perceive",
    "plant_model",
    "score",
    "verify",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
